---
- name: OSCP Toolkit Production Deploy
  hosts: oscp_servers
  become: yes
  tasks:
    - name: Install Python + deps
      apt:
        name: 
          - python3-pip
          - pwntools
        state: present
    
    - name: Deploy OSCP scanners
      copy:
        src: ./oscp-scanners/
        dest: /opt/csio-oscp/
        mode: '0755'
    
    - name: Run attack chain
      command: python3 /opt/csio-oscp/attack_chain_runner.py
