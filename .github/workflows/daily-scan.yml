name: Daily AWS Security Scan
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install boto3 awscli
    - run: chmod +x dashboard.sh || echo "No dashboard.sh - OK"
    - run: bash ./dashboard.sh || echo "Manual scan backup"
