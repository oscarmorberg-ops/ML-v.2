name: 🛡️ Daily CSIO Security Scan
on:
  schedule:
    - cron: '0 8 * * 1'  # Måndag 08:00 CET
  workflow_dispatch:

permissions:  # ← LÄGG TILL DETTA!
  contents: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # ← +DETTA
    - run: pip install -r requirements.txt
    - run: ./dashboard.sh
