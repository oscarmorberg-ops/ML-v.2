name: 🛡️ CSIO ML v2.0
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
jobs:
  ml-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: python-version: '3.11'
    - run: pip install -r requirements.txt
    - run: python s3_ml_scanner.py
    - uses: actions/upload-artifact@v4
      with:
        name: ml-report-v2
        path: ml_*.html
