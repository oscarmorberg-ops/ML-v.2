apiVersion: v1
kind: Secret
metadata:
  name: oscp-vault-auth
  namespace: oscp-prod
type: Opaque
data:
  vault-token: <BASE64_ENCODED_TOKEN>

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: oscp-aws-creds
  namespace: oscp-prod
spec:
  vaultAuthRef: oscp-vault-auth
  mount: secret/data/aws/oscp
  path: aws/creds/oscp-admin
  destination:
    create: true
    name: aws-oscp-creds

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oscp-db-passwords
  namespace: oscp-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: oscp-postgres-creds
  data:
  - secretKey: password
    remoteRef:
      key: secret/postgres
      property: password
