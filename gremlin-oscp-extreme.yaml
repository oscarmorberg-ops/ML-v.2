apiVersion: gremlin.com/v1alpha1
kind: ChaosExperiment
metadata:
  name: oscp-blackhole-traffic
  namespace: oscp-prod
spec:
  lengthSeconds: 300
  logger:
    logger: "file"
    file:
      path: "/tmp/gremlin.log"
  target:
    type: "random"
    labelSelector:
      matchLabels:
        app: oscp-toolkit
  gremlin:
    type: "network"
    attack: "blackhole"
    targetHost: "ALL"
    portRange:
      beginPort: 443
      endPort: 443

---
apiVersion: gremlin.com/v1alpha1
kind: ChaosSchedule
metadata:
  name: oscp-enterprise-chaos
  namespace: oscp-prod
spec:
  experiment: "oscp-blackhole-traffic"
  schedule: "0 */4 * * *"  # Every 4 hours
  lengthSeconds: 600
