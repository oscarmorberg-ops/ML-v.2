apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPSPHostPort
metadata:
  name: oscp-no-hostport
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
  parameters:
    hostPorts:
    - min: 1
      max: 65535

---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: oscp-required-labels
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
  parameters:
    labels:
    - key: "oscp-environment"
    - key: "oscp-team"

---
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: oscpawslimit
spec:
  crd:
    spec:
      names:
        kind: OSCPAWSLimit
  targets:
  - target: admission.k8s.gatekeeper.sh
    rego: |
      package oscpawslimit
      
      violation[{"msg": msg}] {
        container := input.review.object.spec.containers[_]
        container.resources.limits.cpu > "1000m"
        msg := "OSCP CPU limit exceeded"
      }
